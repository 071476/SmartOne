name: Build SmartOne

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download Gradle 8.0
      run: |
        wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

    - name: Reconstruir keystore desde secret
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        python3 -c "import os,base64; data=os.environ['KEYSTORE_B64']; clean=''.join(data.split()); open('app/smartone-release.jks','wb').write(base64.b64decode(clean))"
        SIZE=$(stat -c%s app/smartone-release.jks)
        echo "Tamano del keystore: $SIZE bytes (esperado: 2780)"
        if [ "$SIZE" -ne 2780 ]; then
          echo "ERROR: el keystore no tiene el tamano correcto. El secret esta danado."
          exit 1
        fi
        echo "Keystore reconstruido correctamente."

    - name: Crear keystore.properties
      run: |
        echo "storeFile=smartone-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Build Release APK firmado
      run: gradle assembleRelease --no-daemon

    - name: Build Release AAB firmado
      run: gradle bundleRelease --no-daemon

    - name: Upload APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: SmartOne-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK Release firmado
      uses: actions/upload-artifact@v4
      with:
        name: SmartOne-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Release firmado
      uses: actions/upload-artifact@v4
      with:
        name: SmartOne-aab
        path: app/build/outputs/bundle/release/app-release.aab
