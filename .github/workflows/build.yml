name: Build SmartOne

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download Gradle 8.0
      run: |
        wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

    - name: Reconstruir keystore desde secret
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/smartone-release.jks

    - name: Crear keystore.properties
      run: |
        echo "storeFile=smartone-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Build Release APK firmado
      run: gradle assembleRelease --no-daemon

    - name: Upload APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: SmartOne-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK Release firmado
      uses: actions/upload-artifact@v4
      with:
        name: SmartOne-release
        path: app/build/outputs/apk/release/app-release.apk
